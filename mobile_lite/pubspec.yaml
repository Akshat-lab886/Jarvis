name: jarvis_lite
description: Lightweight paired remote for your Jarvis Mac hub. Chat, offline notes, memory sync.
publish_to: "none"
version: 0.2.0+1

environment:
  sdk: ">=3.2.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  # Hub transport (same /api/mobile/* surface as the PWA client).
  http: ^1.3.0
  # Per-device Bearer token lives in the platform keychain, never prefs.
  flutter_secure_storage: ^9.2.0
  # Offline outbox + hub-event cache.
  sqflite: ^2.3.0
  path: ^1.9.0
  # Non-secret pointers: hub URL, device name, sync cursor.
  shared_preferences: ^2.2.0
  # QR scan of the dashboard's jarvis://pair?hub=..&code=.. link.
  mobile_scanner: ^5.2.0
  # Phone camera → /api/mobile/vision (single-frame JPEG capture).
  image_picker: ^1.1.2
  # Client-side idempotency keys for sync events.
  uuid: ^4.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
